name: Fix Linux typo

on:
  push:
    branches:
      - agent/release-v1.5
    paths:
      - '.github/workflows/fix-linux-typo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v1.5
          fetch-depth: 0
      - name: Apply source-tree typo fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Linux/Proton itteration v1.3.3' Linux-HitmanVRFoveationFix-v1.3.py
          sed -i 's/Linux\/Proton itteration v1.3.3/Linux\/Proton iteration v1.3.3/' Linux-HitmanVRFoveationFix-v1.3.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Linux-HitmanVRFoveationFix-v1.3.py
          git rm .github/workflows/fix-linux-typo.yml
          git commit -m 'Fix Linux iteration typo [skip ci]'
          git push origin HEAD:agent/release-v1.5
